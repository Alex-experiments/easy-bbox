site_name: Easy Bbox
site_url: https://alex-experiments.github.io/easy-bbox/
repo_url: https://github.com/Alex-experiments/easy-bbox
repo_name: Alex-experiments/easy-bbox
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

copyright: Copyright &copy; 2025 Alex-experiments

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Coordinate formats: guide/formats.md
      - Transformations: guide/transformations.md
      - Geometry and utilities: guide/geometry.md
  - API reference: reference/api.md

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: null
  favicon: null
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_section_style: table
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            annotations_path: brief
            merge_init_into_class: true
            show_signature_annotations: true
